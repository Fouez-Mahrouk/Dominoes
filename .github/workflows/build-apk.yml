name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi
          echo "Found: $GRADLEW"
          cd $(dirname $GRADLEW)
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          mkdir -p ./apk-output
          cp "$APK_PATH" ./apk-output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominoes-debug-apk
          path: ./apk-output/
          retention-days: 30   