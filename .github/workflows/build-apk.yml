name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore
        run: |
          mkdir -p ~/keystore
          echo '${{ secrets.KEYSTORE_FILE }}' | base64 -d > ~/keystore/dominoes-release.jks

      - name: Build signed release APK
        run: |
          GRADLEW=$(find . -name "gradlew" -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found!"
            exit 1
          fi
          cd $(dirname $GRADLEW)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PkeystorePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            -PkeyAlias=${{ secrets.KEY_ALIAS }} \
            -PkeyPassword=${{ secrets.KEY_PASSWORD }}

      - name: Verify APK exists
        run: |
          APK_PATH=$(find . -path "*/release/*" -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Release APK not found. Build failed."
            exit 1
          fi
          echo "APK: $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"
          mkdir -p ./apk-output
          cp "$APK_PATH" ./apk-output/Dominoes.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dominoes-release-apk
          path: ./apk-output/
          retention-days: 30   